tableDictionary:
  table_two_pathway_repeated_shock_evidence_matrix:
    tableId: table_two_pathway_repeated_shock_evidence_matrix
    tablePath: data/results/tables/Table_two_pathway_repeated_shock_evidence_matrix.xlsx
    tableCaption: Evidence matrix for two adaptation pathways
    tableAim: Present both cases side by side without pooling their outcomes.
    tableExplanation: Eleven evidence dimensions compare pathway, intervention, chronology, failure, 2026 performance, MMI,
      PGA, outcome comparability, evidence level, permissible claim, and inference ceiling. Mashiki supports bounded service-presence
      evidence; Yokoe supports a directional same-asset restoration contrast.
    tableSuitableSection: Main Results synthesis
  table_candidate_selection_gate_summary:
    tableId: table_candidate_selection_gate_summary
    tablePath: data/results/tables/Table_candidate_selection_gate_summary.xlsx
    tableCaption: Official candidate screening and retained case roles
    tableAim: Summarize four complete candidate denominators and their dominant exclusions.
    tableExplanation: The table compresses 65 audit records into four denominator rows. Three Mashiki stages form one corridor
      case, Yokoe is the sole exact bridge recurrence, and contextual reconstructions remain outside the core.
    tableSuitableSection: 'Supplementary Results: selection audit'
  table_claim_robustness_and_inference_ceilings:
    tableId: table_claim_robustness_and_inference_ceilings
    tablePath: data/results/tables/Table_claim_robustness_and_inference_ceilings.xlsx
    tableCaption: Robustness checks and inference ceilings by claim
    tableAim: Summarize twelve prespecified checks into four substantive claim families.
    tableExplanation: The table records which results are robust, which depend on measurement or source rules, and which extensions
      are prohibited. It prevents descriptive repeated-shock evidence from becoming a causal or population claim.
    tableSuitableSection: 'Supplementary Results: robustness and limitations'
figureDictionary:
  fig_kumamoto_repeated_shock_cases_and_adaptation_pathways:
    figureId: fig_kumamoto_repeated_shock_cases_and_adaptation_pathways
    figurePath: data/results/figures/Figure_kumamoto_repeated_shock_cases_and_adaptation_pathways.png
    figureCaption: Two adaptation pathways across repeated Kumamoto shocks
    figureAim: Locate both core cases and establish failure, adaptation, second-shock, and performance chronology.
    figureExplanation: Panel a maps the Mashiki corridor cluster and Yokoe Bridge. Panels b and c show that each intervention
      was completed after the 2016 failure and before the 2026 earthquake, while preserving the capacity and structural pathways
      as separate cases.
    figureSuitableSection: 'Results: case setting and adaptation chronology'
  fig_mashiki_central_line_repeated_shock_service_evidence:
    figureId: fig_mashiki_central_line_repeated_shock_service_evidence
    figurePath: data/results/figures/Figure_mashiki_central_line_repeated_shock_service_evidence.png
    figureCaption: Mashiki restriction and passage evidence across shocks
    figureAim: Compare documented 2016 restriction states with bounded 2026 probe-passage observations.
    figureExplanation: Panel a shows three positive 2016 restriction observations. Panel b shows passage-layer availability,
      corridor traces, longitudinal coverage, and the first near-full positive observation at no later than 43.55 hours. The
      panels do not imply equivalent outcomes or an exact reopening time.
    figureSuitableSection: 'Results: Mashiki capacity-pathway evidence'
  fig_yokoe_bridge_restoration_under_repeated_shock:
    figureId: fig_yokoe_bridge_restoration_under_repeated_shock
    figurePath: data/results/figures/Figure_yokoe_bridge_restoration_under_repeated_shock.png
    figureCaption: Yokoe restoration timing under repeated stronger shock
    figureAim: Compare same-bridge restoration intervals and test endpoint sensitivity.
    figureExplanation: Panel a compares the 2016 full-reopening and early-access milestones with the 2026 full reopening.
      Panel b shows that both bounded restoration ratios remain below one while 2026 MMI and PGA are higher. The direction
      is robust but not a causal reconstruction effect.
    figureSuitableSection: 'Results: Yokoe structural-pathway evidence'
  fig_case_selection_and_inference_boundaries:
    figureId: fig_case_selection_and_inference_boundaries
    figurePath: data/results/figures/Figure_case_selection_and_inference_boundaries.png
    figureCaption: Candidate gates and permissible inference boundaries
    figureAim: Show gate-specific screening and classify robust, bounded, and unsupported conclusions.
    figureExplanation: Panel a reports screened and gate-passing records for four official candidate universes before collapsing
      nested records to two physical cases. Panel b locates twelve prespecified checks within robust, measurement-boundary,
      or unsupported categories.
    figureSuitableSection: 'Results: selection validity and robustness'
analysisStructureBrief:
  overview: A structured repeated-shock mechanism study of two deliberately non-pooled transport adaptations. The analysis
    combines chronology, case-specific shaking, bounded performance evidence, exhaustive candidate gates, and prespecified
    claim ceilings without treating the 2016 and 2026 shocks as a natural experiment.
  levels:
  - levelName: Common case and hazard contract
    levelAim: Establish temporal ordering and compare event-specific MMI and PGA within each case.
    inputs:
    - Case ID
    - Adaptation Completion
    - Failure Evidence 2016
    - Performance Evidence 2026
    - Mean MMI 2016
    - Mean MMI 2026
    - Mean PGA 2016 (g)
    - Mean PGA 2026 (g)
    modelOrMethod: Structured case audit plus \(\Delta M_c=M_{c,2026}-M_{c,2016}\) and \(Q_c=P_{c,2026}/P_{c,2016}\). Metric
      disagreement produces a measurement-dependent hazard classification rather than a composite score.
    outputs:
    - Kumamoto Repeated-Shock Cases and Adaptation Pathways
    - Two-Pathway Repeated-Shock Evidence Matrix
    interpretation: The variables establish two traceable post-failure adaptations tested by a second shock. They do not create
      random assignment, common support, or a natural experiment.
  - levelName: Mashiki service-presence analysis
    levelAim: Estimate bounded positive passage evidence among available 2026 observations.
    inputs:
    - Passage Layer Available
    - Observed Corridor Passage
    - Unique Corridor Traces
    - Longitudinal Coverage Proxy
    - Elapsed Hours Since Event
    - Event-Time Bound
    modelOrMethod: Coverage-normalized service presence is \(S_M=\sum_t A_tP_t/\sum_t A_t\). The first near-full observation
      is \(h_M^{near}=\min\{h_t:A_t=1,P_t=1,C_t\geq0.80\}\). Unavailable layers remain missing.
    outputs:
    - Mashiki Central Line Repeated-Shock Service Evidence
    - Two-Pathway Repeated-Shock Evidence Matrix
    interpretation: Observed passage in 20 of 21 available layers and the 43.55-hour bound indicate service presence consistent
      with capacity tolerance. They do not establish continuous passage, normal traffic, an undamaged road, or a like-for-like
      2016 recovery ratio.
  - levelName: Yokoe matched-endpoint restoration analysis
    levelAim: Test whether faster 2026 restoration survives two admissible 2016 endpoints.
    inputs:
    - Endpoint Definition
    - Restoration Hours Lower Bound 2016
    - Restoration Hours Upper Bound 2016
    - Restoration Hours Lower Bound 2026
    - Restoration Hours Upper Bound 2026
    - Mean MMI 2016
    - Mean MMI 2026
    - Mean PGA 2016 (g)
    - Mean PGA 2026 (g)
    modelOrMethod: For endpoint \(k\), \(R_{Y,k}^{L}=T_{Y,2026}^{L}/T_{Y,2016,k}^{U}\), \(R_{Y,k}^{U}=T_{Y,2026}^{U}/T_{Y,2016,k}^{L}\),
      and \(F_{Y,k}=1\{R_{Y,k}^{U}<1\}\). Directional dominance requires every admissible upper bound below one and stronger
      2026 MMI and PGA.
    outputs:
    - Yokoe Bridge Restoration Under Repeated Shock
    - Two-Pathway Repeated-Shock Evidence Matrix
    interpretation: Both endpoint ratios remain below one under stronger measured 2026 shaking. This is a robust within-asset
      direction, not a causal effect of reconstruction or evidence that shaking intensity equals damage severity.
  - levelName: Candidate-selection audit
    levelAim: Apply unit-consistent identity, geometry, hazard, and outcome gates to complete official denominators.
    inputs:
    - Candidate Universe
    - Gate Unit
    - Identity Gate
    - Geometry Gate
    - Hazard Gate
    - Outcome Gate
    - Core Status
    - Exclusion Reason
    modelOrMethod: For universe \(u\), \(N_u=\sum_i1\{U_i=u\}\) and gate counts are \(N_{u,g}=\sum_i1\{U_i=u\}1\{G_{i,g}=pass\}\).
      Admissibility is \(A_i=1\{I_i=1\}1\{G_i=1\}1\{O_i=1\}1\{H_i\in\{pass,metric\ dependent\}\}\).
    outputs:
    - Case Selection and Inference Boundaries
    - Candidate Selection Gate Summary
    interpretation: All retained rows satisfy the declared gates at their gate unit before nested records collapse to two
      physical cases. Counts describe audit coverage, not prevalence or selection probabilities.
  - levelName: Claim robustness classification
    levelAim: Classify conclusions across prespecified measurement, endpoint, denominator, geometry, and source scenarios.
    inputs:
    - Claim ID
    - Sensitivity Dimension
    - Scenario
    - Result
    - Classification
    - Evidence
    - Inference Ceiling
    modelOrMethod: 'Ordered classification algorithm: retain a claim as robust when all applicable scenarios preserve it;
      label it measurement dependent when a metric, endpoint, observation, or source rule must remain attached; label it unsupported
      when a required gate fails.'
    outputs:
    - Case Selection and Inference Boundaries
    - Claim Robustness and Inference Ceilings
    interpretation: The classifications distinguish stable findings from bounded statements and prohibited extensions. They
      are categorical evidence judgments, not numeric scores or statistical tests.
  - levelName: Cross-output evidence synthesis
    levelAim: Connect pathway evidence to permissible claims and explicit inference ceilings.
    inputs:
    - Adaptation Pathway
    - Outcome Comparability
    - Evidence Level
    - Permissible Claim
    - Inference Ceiling
    modelOrMethod: 'Structured non-pooled synthesis: each case must retain its own mechanism, outcome system, hazard interpretation,
      sensitivity result, and inference ceiling; no common estimand or pooled coefficient is computed.'
    outputs:
    - Two-Pathway Repeated-Shock Evidence Matrix
    interpretation: The synthesis supports pathway-specific mechanism consistency and evidence-boundary learning. It excludes
      causal attribution, average resilience dividends, network-wide benefit claims, and population inference.
