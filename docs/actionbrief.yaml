doc_type: actionbrief
version: 1.0.0
datasetDictionary:
  two_case_evidence:
    datasetSourceName: data/processed/repeated_shock_two_case_evidence_preprocessed.parquet
    datasetDescription: Integrated evidence contract for the two non-pooled adaptation cases.
    datasetProvider: Study synthesis of MLIT, Kumamoto prefectural and municipal records, NIED shaking products, and audited
      official project records.
    datasetGenerationInfo: Generated by joining audited intervention chronology, 2016 failure evidence, 2026 performance evidence,
      and case-specific shaking summaries.
    datasetPeriod: April 2016 to August 2026
    datasetScale: 2 core adaptation cases and 18 variables
    datasetSpatialResolution: One Mashiki corridor cluster and one Yokoe bridge
    datasetTemporalResolution: Case-level cross-event synthesis with dated adaptation and performance milestones
    datasetAttribute: table
    datasetPreprocessingInfo: English readable names; whitespace trimming; explicit numeric, datetime, and nullable-Boolean
      parsing; no imputation; source references retained where applicable.
  mashiki_event_state:
    datasetSourceName: data/processed/mashiki_repeated_shock_event_state_preprocessed.parquet
    datasetDescription: Mashiki corridor event-state observations preserving different 2016 and 2026 measurement systems.
    datasetProvider: NIED 2016 road-condition evidence and MLIT 2026 private-probe passage archives.
    datasetGenerationInfo: Generated from three positive 2016 restriction summaries and 25 time-indexed 2026 passage snapshots
      with archive hashes.
    datasetPeriod: April 2016 and 28 July to August 2026
    datasetScale: 28 event-state observations and 17 variables
    datasetSpatialResolution: Named subsegments and the official 3.5 km Mashiki Central corridor polygon
    datasetTemporalResolution: Calendar-day 2016 observations and irregular 2026 archive snapshots
    datasetAttribute: table
    datasetPreprocessingInfo: English readable names; whitespace trimming; explicit numeric, datetime, and nullable-Boolean
      parsing; no imputation; source references retained where applicable.
  yokoe_matched_endpoint:
    datasetSourceName: data/processed/yokoe_matched_endpoint_preprocessed.parquet
    datasetDescription: Same-bridge restoration bounds under primary and sensitivity endpoint definitions.
    datasetProvider: Kumamoto and Yatsushiro official restoration records, MLIT disaster records, and NIED shaking products.
    datasetGenerationInfo: Generated by matching Yokoe Bridge across the 2016 and 2026 events and calculating bounded endpoint-specific
      restoration ratios.
    datasetPeriod: 16 April 2016 to 17 August 2026
    datasetScale: 2 endpoint definitions and 18 variables
    datasetSpatialResolution: One physical bridge
    datasetTemporalResolution: Event-to-milestone intervals with calendar-day or confirmed-time bounds
    datasetAttribute: table
    datasetPreprocessingInfo: English readable names; whitespace trimming; explicit numeric, datetime, and nullable-Boolean
      parsing; no imputation; source references retained where applicable.
  candidate_ledger:
    datasetSourceName: data/processed/repeated_shock_candidate_ledger_preprocessed.parquet
    datasetDescription: Consolidated audit ledger for all candidates in four official screening universes.
    datasetProvider: MLIT, Kumamoto Prefecture, Mashiki Town, Yatsushiro City, and audited official reconstruction inventories.
    datasetGenerationInfo: Generated by harmonizing local-road projects, 2016 restored bridges, 2026 bridge-damage records,
      and contextual reconstruction candidates under common gates.
    datasetPeriod: Post-April 2016 reconstruction through the 2026 earthquake response
    datasetScale: 65 candidate records across 4 official universes
    datasetSpatialResolution: Project stage, corridor cluster, physical bridge, or contextual asset
    datasetTemporalResolution: Candidate-level audit record; not a regular time series
    datasetAttribute: table
    datasetPreprocessingInfo: English readable names; whitespace trimming; explicit numeric, datetime, and nullable-Boolean
      parsing; no imputation; source references retained where applicable.
  case_geometries:
    datasetSourceName: data/processed/repeated_shock_case_geometries_preprocessed.parquet
    datasetDescription: Verified display and linkage geometries for the two core cases.
    datasetProvider: Official Mashiki corridor planning geometry and MLIT 2026 bridge-damage restriction geometry.
    datasetGenerationInfo: Generated by retaining one eligible aggregate corridor polygon and the exact Yokoe bridge-damage
      segment after geometry-gate validation.
    datasetPeriod: Geometry references verified for the 2026 analytical contract
    datasetScale: 2 case geometries and 9 attributes
    datasetSpatialResolution: Corridor polygon and bridge-linked line segment in EPSG:4326
    datasetTemporalResolution: Static case geometry
    datasetAttribute: table
    datasetPreprocessingInfo: English readable names; whitespace trimming; explicit numeric, datetime, and nullable-Boolean
      parsing; no imputation; source references retained where applicable.
  claim_sensitivity:
    datasetSourceName: data/processed/repeated_shock_claim_sensitivity_preprocessed.parquet
    datasetDescription: Prespecified sensitivity and inference-ceiling records for four claim families.
    datasetProvider: Study-generated from audited official evidence and the final analytical framework.
    datasetGenerationInfo: Generated by evaluating hazard metrics, endpoints, observation coverage, outcome equivalence, selection
      denominators, geometry, and source precedence.
    datasetPeriod: Evidence spanning the 2016 and 2026 earthquake episodes
    datasetScale: 12 claim-scenario checks across 4 claim families
    datasetSpatialResolution: Two core cases plus four official candidate universes
    datasetTemporalResolution: Scenario matrix; not a time series
    datasetAttribute: table
    datasetPreprocessingInfo: English readable names; whitespace trimming; explicit numeric, datetime, and nullable-Boolean
      parsing; no imputation; source references retained where applicable.
